name: Linter

on:
  workflow_dispatch:
  push:
    paths:
      - "**.py"
      - "Dockerfile"
      - "terraform/**"
      - ".versions"
      - ".github/workflows/linter.yml"

permissions:
  contents: read

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Load versions
        run: cat .versions >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # 7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            .versions

      - name: Install Ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Load versions
        run: cat .versions >> "$GITHUB_ENV"

      - name: Cache Hadolint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: .hadolint-bin
          key: hadolint-${{ runner.os }}-${{ env.HADOLINT_VERSION }}

      - name: Install Hadolint
        run: |
          mkdir -p .hadolint-bin
          if [ ! -x .hadolint-bin/hadolint ]; then
            curl -fsSL -o .hadolint-bin/hadolint \
              "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
            chmod +x .hadolint-bin/hadolint
          fi
          echo "${GITHUB_WORKSPACE}/.hadolint-bin" >> "$GITHUB_PATH"

      - name: Hadolint
        run: hadolint Dockerfile

  terraform-lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/ecr
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Load versions
        run: cat "${GITHUB_WORKSPACE}/.versions" >> "$GITHUB_ENV"
        working-directory: ${{ github.workspace }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # 3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # 4.1.1
        with:
          tflint_version: v${{ env.TFLINT_VERSION }}

      - name: Terraform init
        run: terraform init -backend=false

      - name: TFLint init
        run: tflint --init

      - name: Terraform format check
        run: terraform fmt --check -recursive -diff .

      - name: Lint Terraform ECR
        working-directory: terraform/ecr
        run: tflint --recursive --format compact
