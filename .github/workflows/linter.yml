name: Linter

on:
  workflow_dispatch:
  # pull_request:
  #   branches:
  #     - main

permissions:
  contents: read

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Load versions
        run: |
          set -e
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            echo "$line" >> "$GITHUB_ENV"
          done < .versions

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # 7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            .versions

      - name: Install Ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Load versions
        run: |
          set -e
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            echo "$line" >> "$GITHUB_ENV"
          done < .versions

      - name: Cache Hadolint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: .hadolint-bin
          key: hadolint-${{ runner.os }}-${{ env.HADOLINT_VERSION }}

      - name: Install Hadolint
        run: |
          mkdir -p .hadolint-bin
          if [ ! -x .hadolint-bin/hadolint ]; then
            curl -fsSL -o .hadolint-bin/hadolint \
              "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
            chmod +x .hadolint-bin/hadolint
          fi
          echo "${GITHUB_WORKSPACE}/.hadolint-bin" >> "$GITHUB_PATH"

      - name: Hadolint
        run: hadolint Dockerfile
