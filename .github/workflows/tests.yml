name: Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "**.py"

permissions:
  contents: read

jobs:
  python-unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Load versions
        run: cat .versions >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # 7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-prod.txt
            .versions

      - name: Install dependencies
        run: pip install -r requirements-prod.txt "pytest==${PYTEST_VERSION}"

      - name: Run tests
        run: pytest
