<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Room reservations{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ url_for('main.index') }}">python-monolit</a>
      <nav class="site-nav" aria-label="Main">
        <a href="{{ url_for('main.index') }}">Home</a>
        <a href="{{ url_for('main.book') }}">Book</a>
      </nav>
    </div>
  </header>

  <main class="wrap site-main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flash-list">
          {% for category, message in messages %}
            <li class="flash flash-{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Room reservation monolith — learning project.</p>
    </div>
  </footer>
</body>
</html>
