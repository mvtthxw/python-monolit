{% extends "base.html" %}

{% block title %}{{ title }} — Admin{% endblock %}

{% block content %}
  <section class="page-intro">
    <h1>{{ title }}</h1>
    <p><a href="{{ url_for('admin.dashboard') }}">← Back to admin</a></p>
  </section>

  <section class="panel">
    <form method="post" class="stack-form" novalidate>
      {{ form.hidden_tag() }}

      <label>
        {{ form.name.label }}
        {{ form.name }}
        {% for error in form.name.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
      </label>

      <label>
        {{ form.capacity.label }}
        {{ form.capacity }}
        {% for error in form.capacity.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
      </label>

      <label>
        {{ form.description.label }}
        {{ form.description(rows=4) }}
        {% for error in form.description.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
      </label>

      <label class="checkbox-row">
        {{ form.is_active() }}
        {{ form.is_active.label.text }}
      </label>

      {{ form.submit(class_="button") }}
    </form>
  </section>
{% endblock %}
