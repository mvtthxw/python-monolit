repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.175.0
    hooks:
      - id: semgrep
        types: [python]
        args:
          - --config=p/python
          - --config=p/flask
          - --config=p/owasp-top-ten
          - --error
          - --disable-version-check
          - --quiet
          - --skip-unknown-extensions

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: .local-venv/bin/pytest
        language: system
        pass_filenames: false
        files: ^(app/|tests/|wsgi\.py|requirements)

  - repo: local
    hooks:
      - id: tflint
        name: tflint
        entry: bash -c 'cd terraform && tflint --init && tflint --recursive'
        language: system
        pass_filenames: false
        files: ^terraform/
